# Codemagic: сборка ModemMon iOS без Mac.
#
# Проект лежит в корне репозитория.
#
# ios-unsigned — соберёт ModemMon-unsigned.zip (Payload-формат, ставится через AltStore/SideStore).
# ios-signed   — подписанная .ipa: в Codemagic подключи Apple Developer Portal (Teams →
#                Connected accounts → Apple Developer Portal), потом запусти этот workflow.
#
# Артефакты появятся во вкладке Artifacts после сборки.

workflows:
  ios-unsigned:
    name: ModemMon iOS (unsigned)
    max_build_duration: 30
    environment:
      xcode: latest
    scripts:
      - name: Build (no codesign)
        script: |
          set -e
          cd $CM_BUILD_DIR
          xcodebuild -project ModemMon.xcodeproj \
            -target ModemMon \
            -configuration Release \
            -sdk iphoneos \
            SYMROOT="$PWD/build" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            build
      - name: Package zip (с иконкой)
        script: |
          set -e
          cd $CM_BUILD_DIR/build/Release-iphoneos
          # иконки в бандл + регистрация в Info.plist (фаза ресурсов иногда не копирует их сама)
          cp $CM_BUILD_DIR/ModemMon/AppIcon@2x.png ModemMon.app/ 2>/dev/null || true
          cp $CM_BUILD_DIR/ModemMon/AppIcon@3x.png ModemMon.app/ 2>/dev/null || true
          PLIST=ModemMon.app/Info.plist
          /usr/libexec/PlistBuddy -c "Add :CFBundleIcons dict" $PLIST 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :CFBundleIcons:CFBundlePrimaryIcon dict" $PLIST 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :CFBundleIcons:CFBundlePrimaryIcon:CFBundleIconFiles array" $PLIST 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :CFBundleIcons:CFBundlePrimaryIcon:CFBundleIconFiles:0 string AppIcon" $PLIST 2>/dev/null || true
          zip -qry "$CM_BUILD_DIR/ModemMon-unsigned.zip" ModemMon.app
    artifacts:
      - ModemMon-unsigned.zip

  ios-signed:
    name: ModemMon iOS (signed, development)
    max_build_duration: 30
    environment:
      xcode: latest
      ios_signing:
        distribution_type: development
        bundle_identifier: ru.franh.modemmon
    scripts:
      - name: Fetch signing files
        script: xcode-project use-profiles
      - name: Build and sign ipa
        script: |
          set -e
          cd $CM_BUILD_DIR
          xcode-project build-ipa \
            --project ModemMon.xcodeproj \
            --config Release
    artifacts:
      - build/ios/ipa/*.ipa
