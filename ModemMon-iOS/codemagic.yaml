# Codemagic: сборка ModemMon iOS без Mac.
#
# Вариант A (просто получить .app/.ipa без подписи, ставить через AltStore/Sidestore с своим Apple ID):
#   запустить workflow ios-unsigned — на выходе Payload.zip.
#
# Вариант B (подписанная .ipa для установки на устройство):
#   1) В Codemagic: Teams → Apple Developer Portal Connection, войти своим Apple ID.
#   2) В workflow ios-signed включена автоматическая подписка (development).
#   Бесплатный аккаунт Apple: подпись живёт 7 дней, потом пересобрать.
#
# Артефакты появятся в разделе Builds → Artifacts.

workflows:
  ios-unsigned:
    name: ModemMon iOS (unsigned)
    max_build_duration: 30
    environment:
      xcode: latest
      cocoapods: default
    scripts:
      - name: Build (no codesign)
        script: |
          set -e
          xcodebuild -project ModemMon.xcodeproj \
            -scheme ModemMon \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            build
      - name: Package Payload.zip
        script: |
          set -e
          cd build/Build/Products/Release-iphoneos
          zip -qry "$CM_BUILD_DIR/ModemMon-unsigned.zip" ModemMon.app
    publishing:
      email:
        recipients: []
      scripts:
        after_build: []

  ios-signed:
    name: ModemMon iOS (signed, development)
    max_build_duration: 30
    environment:
      xcode: latest
      groups:
        - appstore_credentials   # подключить через Codemagic UI: Apple Developer Portal Connection
      ios_signing:
        distribution_type: development
        bundle_identifier: ru.franh.modemmon
    scripts:
      - name: Fetch signing files
        script: |
          set -e
          xcode-project use-profiles
      - name: Build and sign
        script: |
          set -e
          xcode-project build-ipa \
            --project ModemMon.xcodeproj \
            --scheme ModemMon \
            --config Release
    publishing:
      email:
        recipients: []
